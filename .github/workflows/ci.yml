name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package:firefox
      - name: Package Chrome extension
        run: zip -r chrome-scratchpad-extension.zip manifest.json src assets README.md PRIVACY.md package.json LICENSE -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            chrome-scratchpad-extension.zip
            scratchpad-firefox.zip
