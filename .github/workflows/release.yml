name: Release extension packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package:firefox
      - run: zip -r chrome-scratchpad-extension.zip manifest.json src assets README.md PRIVACY.md package.json LICENSE -x '*.DS_Store'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            chrome-scratchpad-extension.zip
            dist/scratchpad-firefox.zip
