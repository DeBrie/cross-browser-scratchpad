name: Release extension packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.5
      - run: npm ci
      - run: npm run rebuild:lute
      - run: git diff --exit-code -- third_party/lute/javascript/lute.min.js
      - run: npm test
      - run: npm run check
      - run: npm run package:firefox
      - run: npm run package:source
      - run: zip -r chrome-scratchpad-extension.zip manifest.json src assets README.md PRIVACY.md package.json LICENSE -x '*.DS_Store'
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            chrome-scratchpad-extension.zip
            dist/scratchpad-firefox.zip
            dist/cross-browser-scratchpad-source.zip
