<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/vendor/vditor/dist/index.css" />
    <style>
      #frame { width: 640px; overflow: hidden; }
      #editor { width: 100%; max-width: 100%; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="editor"></div></div>
    <script src="../src/vendor/vditor/dist/index.min.js"></script>
    <script>
      const base = new URL('../src/vendor/vditor', location.href).href;
      const markdown = '# Heading\n\n- [ ] Keep whitespace\n- **Bold** and `code`\n\nA long sentence should wrap inside the scratchpad editor without creating horizontal scrolling at any supported panel width.';
      const editor = new Vditor('editor', {
        mode: 'ir',
        cache: { enable: false },
        cdn: base,
        lang: 'en_US',
        toolbar: [],
        icon: '',
        width: '100%',
        value: markdown,
        after() {
          const rendered = editor.getHTML();
          document.body.dataset.ready = 'true';
          document.body.dataset.mode = editor.getCurrentMode();
          document.body.dataset.value = btoa(editor.getValue());
          document.body.dataset.headingRendered = String(/<h1[^>]*>Heading<\/h1>/.test(rendered));
          document.body.dataset.taskRendered = String(/type="checkbox"/.test(rendered));
          const frame = document.querySelector('#frame');
          frame.style.width = '280px';
          requestAnimationFrame(() => {
            const canvas = document.querySelector('.vditor-ir pre.vditor-reset');
            const root = document.querySelector('#editor');
            document.body.dataset.overflows = String(
              canvas.scrollWidth > frame.clientWidth || root.scrollWidth > frame.clientWidth,
            );
            document.body.dataset.hasInlineIconScript = String(Boolean(document.querySelector('#vditorIconScript')));
            document.body.dataset.noNetwork = String(![...document.scripts].some((script) => /^https?:/.test(script.src)));
          });
        },
      });
    </script>
  </body>
</html>
